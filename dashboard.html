<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PurelyBuild | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">
    
    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">PurelyBuild</a>
            <div class="flex items-center gap-4">
                <span id="user-email" class="text-xs text-slate-400 font-medium">...</span>
                <button id="logout-btn" onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-4 py-2 rounded-lg transition border border-slate-700">Sign Out</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 py-10 w-full flex-grow">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-2xl font-bold text-white">My Websites</h1>
                <p class="text-xs text-slate-400 mt-1">Manage and deploy your automated web projects</p>
            </div>
            <button onclick="alert('Creating new site feature coming soon!')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-5 py-3 rounded-lg transition self-start sm:self-auto cursor-pointer">+ Create New Site</button>
        </div>

        <!-- Sites Container -->
        <div id="sites-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-16 text-slate-500 text-sm">
                Loading your sites...
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-600">
        <p>&copy; 2026 PurelyBuild. All rights reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://zpxqetyrzpeleimnvzgq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_f8An8GUjq9__N2pzvfmsKg_nrPGnKKY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function initDashboard() {
            try {
                // 1. Check current session
                const { data: { session }, error } = await supabase.auth.getSession();
                
                if (error || !session) {
                    window.location.href = 'auth.html';
                    return;
                }

                // 2. Display email
                document.getElementById('user-email').innerText = session.user.email;

                // 3. Load user sites
                await loadSites(session.user.id);
            } catch (err) {
                console.error(err);
                showEmptyState();
            }
        }

        async function loadSites(userId) {
            const container = document.getElementById('sites-container');
            
            try {
                const { data: sites, error } = await supabase
                    .from('sites')
                    .select('*')
                    .eq('user_id', userId);

                if (error || !sites || sites.length === 0) {
                    showEmptyState();
                    return;
                }

                container.innerHTML = sites.map(site => `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-slate-700 transition">
                        <h3 class="font-semibold text-white text-base">${site.name || 'Untitled Site'}</h3>
                        <p class="text-xs text-slate-400 mt-1">${site.domain || 'No domain'}</p>
                    </div>
                `).join('');
            } catch (e) {
                showEmptyState();
            }
        }

        function showEmptyState() {
            const container = document.getElementById('sites-container');
            container.innerHTML = `
                <div class="col-span-full text-center py-16 bg-slate-900/50 border border-slate-800 rounded-2xl p-8">
                    <p class="text-slate-300 text-sm font-medium mb-1">Welcome to your dashboard!</p>
                    <p class="text-slate-500 text-xs mb-6">You haven't created any websites yet.</p>
                    <button onclick="alert('Creating new site feature coming soon!')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-4 py-2.5 rounded-lg transition">+ Create Your First Site</button>
                </div>`;
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            window.location.href = 'auth.html';
        }

        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
