<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PurelyBuild | Automated Website Factory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">
    
    <!-- Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img id="store-logo" src="" alt="" class="h-8 w-8 rounded-full object-cover hidden" />
                <a href="index.html" id="store-title" class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">PurelyBuild</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="auth.html" class="text-slate-400 hover:text-white text-sm transition">Sign In</a>
                <a href="auth.html" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition">Get Started</a>
            </div>
        </div>
    </header>

    <!-- Hero Section / Dynamic Storefront -->
    <main class="max-w-4xl mx-auto px-6 py-20 text-center flex-grow flex flex-col justify-center">
        <span class="inline-block px-3 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-full text-xs font-semibold mb-6 self-center">Automated Web Platform Engine</span>
        
        <h1 class="text-4xl md:text-6xl font-extrabold text-white tracking-tight leading-tight mb-6">
            Build & Deploy Automated Websites <br class="hidden sm:inline">in Seconds.
        </h1>
        
        <p class="text-slate-400 text-base md:text-lg max-w-2xl mx-auto mb-10">
            Launch high-performance, fully managed web applications instantly. PurelyBuild handles orchestration, routing, and deployment automatically.
        </p>

        <!-- Waitlist Form -->
        <div class="max-w-md mx-auto w-full mb-12">
            <form id="waitlist-form" class="flex flex-col sm:flex-row gap-3">
                <input id="email-input" type="email" required placeholder="Enter your email address" class="bg-slate-900 border border-slate-800 text-slate-200 text-sm rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 flex-1">
                <button type="submit" id="submit-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-lg text-sm transition whitespace-nowrap">Join Waitlist</button>
            </form>
            <p id="form-msg" class="text-xs text-slate-400 mt-3 h-4"></p>
        </div>

        <!-- Dynamic Store Products Container -->
        <section class="w-full mt-12">
            <div id="products-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <!-- Products will be loaded dynamically here -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-600">
        <p>&copy; 2026 PurelyBuild. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script>
        const SUPABASE_URL = 'https://zpxqetyrpeleimnvzgq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpweHFldHlyenBlbGVpbW52emdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1OTMxNTMsImV4cCI6MjEwMzE2OTE1M30.2zkNQwBPY99wJhKQwbSXCo9bq640EXlm3E4j32sDmbU';
        
        // Initialize Supabase Client globally for the engine
        window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Waitlist Form Handler
        const form = document.getElementById('waitlist-form');
        const emailInput = document.getElementById('email-input');
        const submitBtn = document.getElementById('submit-btn');
        const formMsg = document.getElementById('form-msg');

        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = emailInput.value.trim();
                if (!email) return;

                submitBtn.disabled = true;
                submitBtn.innerText = 'Submitting...';
                formMsg.className = 'text-xs text-slate-400 mt-3 h-4';
                formMsg.innerText = 'Connecting...';

                const { error } = await window.supabaseClient.from('leads').insert([{ email: email }]);

                if (error) {
                    formMsg.className = 'text-xs text-red-400 mt-3 h-4';
                    if (error.message.includes('unique')) {
                        formMsg.innerText = '⚠️ Email is already registered!';
                    } else {
                        formMsg.innerText = '❌ Error: ' + error.message;
                    }
                } else {
                    formMsg.className = 'text-xs text-emerald-400 mt-3 h-4';
                    formMsg.innerText = '🎉 You are on the waitlist!';
                    emailInput.value = '';
                }

                submitBtn.disabled = false;
                submitBtn.innerText = 'Join Waitlist';
            });
        }
    </script>
    
    <!-- Store Engine Script -->
    <script src="store-engine.js"></script>
</body>
</html>
