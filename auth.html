<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PurelyBuild | Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">
    
    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">PurelyBuild</a>
            <a href="index.html" class="text-slate-400 hover:text-white text-sm transition">← Back to Home</a>
        </div>
    </header>

    <!-- Auth Form Box -->
    <main class="max-w-md mx-auto px-6 py-12 w-full flex-grow flex flex-col justify-center">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
            
            <!-- Tabs -->
            <div class="flex border-b border-slate-800 mb-6">
                <button type="button" id="tab-login" onclick="switchTab('login')" class="flex-1 py-3 text-center text-sm font-semibold border-b-2 border-blue-500 text-blue-400 focus:outline-none cursor-pointer">Sign In</button>
                <button type="button" id="tab-signup" onclick="switchTab('signup')" class="flex-1 py-3 text-center text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 focus:outline-none cursor-pointer">Create Account</button>
            </div>

            <!-- Header Text -->
            <div class="text-center mb-6">
                <h2 id="form-title" class="text-2xl font-bold text-white">Welcome Back</h2>
                <p id="form-subtitle" class="text-xs text-slate-400 mt-1">Enter your credentials to access your dashboard</p>
            </div>

            <!-- Form -->
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
                    <input id="auth-email" type="email" required placeholder="name@company.com" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input id="auth-password" type="password" required minlength="6" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500">
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-lg text-sm transition mt-2">Sign In</button>
            </form>

            <!-- Status Message -->
            <div id="auth-msg" class="text-center text-xs font-medium mt-4 min-h-[20px]"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-600">
        <p>&copy; 2026 PurelyBuild. All rights reserved.</p>
    </footer>

    <script>
        let currentMode = 'login';
        const SUPABASE_URL = 'https://zpxqetyrzpeleimnvzgq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_f8An8GUjq9__N2pzvfmsKg_nrPGnKKY';
        let supabaseClient = null;

        function getSupabase() {
            if (!supabaseClient) {
                if (window.supabase && window.supabase.createClient) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                } else {
                    throw new Error('Supabase script not loaded yet. Please refresh the page.');
                }
            }
            return supabaseClient;
        }

        function switchTab(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const formTitle = document.getElementById('form-title');
            const formSubtitle = document.getElementById('form-subtitle');
            const submitBtn = document.getElementById('auth-submit-btn');
            const msg = document.getElementById('auth-msg');

            if (msg) msg.innerText = '';

            if (mode === 'login') {
                tabLogin.className = 'flex-1 py-3 text-center text-sm font-semibold border-b-2 border-blue-500 text-blue-400 focus:outline-none cursor-pointer';
                tabSignup.className = 'flex-1 py-3 text-center text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 focus:outline-none cursor-pointer';
                formTitle.innerText = 'Welcome Back';
                formSubtitle.innerText = 'Enter your credentials to access your dashboard';
                submitBtn.innerText = 'Sign In';
            } else {
                tabSignup.className = 'flex-1 py-3 text-center text-sm font-semibold border-b-2 border-blue-500 text-blue-400 focus:outline-none cursor-pointer';
                tabLogin.className = 'flex-1 py-3 text-center text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 focus:outline-none cursor-pointer';
                formTitle.innerText = 'Create your account';
                formSubtitle.innerText = 'Get started with PurelyBuild in seconds';
                submitBtn.innerText = 'Create Account';
            }
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const msg = document.getElementById('auth-msg');

            msg.className = 'text-center text-xs font-medium text-slate-400 mt-4';
            msg.innerText = 'Processing...';

            try {
                const client = getSupabase();

                if (currentMode === 'login') {
                    const { data, error } = await client.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    msg.className = 'text-center text-xs font-medium text-emerald-400 mt-4';
                    msg.innerText = '🎉 Logged in! Redirecting...';
                    setTimeout(() => window.location.href = 'dashboard.html', 800);
                } else {
                    const { data, error } = await client.auth.signUp({ 
                        email, 
                        password,
                        options: { emailRedirectTo: 'https://purelybuild.com/dashboard.html' }
                    });
                    if (error) throw error;

                    if (data.user && !data.session) {
                        msg.className = 'text-center text-xs font-medium text-emerald-400 mt-4 leading-relaxed';
                        msg.innerText = '📩 Confirmation link sent! Please check your email inbox.';
                    } else if (data.session) {
                        msg.className = 'text-center text-xs font-medium text-emerald-400 mt-4';
                        msg.innerText = '🎉 Account created! Redirecting...';
                        setTimeout(() => window.location.href = 'dashboard.html', 800);
                    }
                }
            } catch (err) {
                msg.className = 'text-center text-xs font-medium text-red-400 mt-4';
                msg.innerText = '❌ ' + err.message;
            }
        });
    </script>
</body>
</html>
